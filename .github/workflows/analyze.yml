name: Analyze libapp with blutter

# 分析指定 target（targets/<target>/lib/arm64-v8a/libapp.so + libflutter.so），
# 产物命名 blutter-out-<target>（每 App 每版本一份）。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'targets/ 目录名 (内含 lib/arm64-v8a/libapp.so + libflutter.so)'
        required: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build build-essential pkg-config \
            libicu-dev libcapstone-dev python3 python3-pyelftools \
            python3-requests python3-pip

      - name: Clone blutter 源码
        run: git clone --depth 1 https://github.com/worawit/blutter.git

      - name: 运行 blutter 分析
        working-directory: blutter
        run: |
          set -eux
          INDIR="$GITHUB_WORKSPACE/targets/${{ github.event.inputs.target }}/lib/arm64-v8a"
          OUTDIR="$GITHUB_WORKSPACE/out/${{ github.event.inputs.target }}"
          ls -la "$INDIR"
          # blutter 不会自动创建多级父目录，必须先建
          mkdir -p "$OUTDIR"
          python3 blutter.py "$INDIR" "$OUTDIR"

      - name: 上传分析产物
        uses: actions/upload-artifact@v4
        with:
          name: blutter-out-${{ github.event.inputs.target }}
          path: |
            out/${{ github.event.inputs.target }}/
          if-no-files-found: error
